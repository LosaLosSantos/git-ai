apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: gitaly

build:
  artifacts:
  - image: ko.local/gitaly-base
    docker:
      dockerfile: Dockerfile.base
    # .ko.yaml builds on :latest, but skaffold tags this image with the git tag.
    # Lets re-tag the image with latest
    hooks:
      after:
        - command: ["sh", "-c", "docker tag \"$SKAFFOLD_IMAGE\" ko.local/gitaly-base:latest"]
  - image: registry.gitlab.com/gitlab-org/build/cng/gitaly
    # Build the base image first; skaffold otherwise builds both in parallel
    # and ko fails to find ko.local/gitaly-base:latest on a fresh Docker daemon
    # cache. In `.ko.yaml`, it builds from `defaultBaseImage: ko.local/gitaly-base:latest`.`
    requires:
      - image: ko.local/gitaly-base
    ko:
      main: ./cmd/gitaly
      dependencies:
        paths:
        - cmd/gitaly
        - cmd/gitaly-hooks
        - cmd/gitaly-ssh
        - cmd/gitaly-lfs-smudge
        - cmd/gitaly-gpg
        - internal
        - proto/go
        - go.mod
        - go.sum
        - _build/bin/gitaly-hooks
        - _build/bin/gitaly-ssh
        - _build/bin/gitaly-lfs-smudge
        - _build/bin/gitaly-gpg
        - _build/bin/gitaly-git-master
        - _build/bin/gitaly-git-prev
        - _build/bin/gitaly-git-mvcc
        - _build/bin/gitaly-git-http-backend-master
        - _build/bin/gitaly-git-http-backend-prev
        - _build/bin/gitaly-git-http-backend-mvcc
        - _build/bin/gitaly-git-remote-http-master
        - _build/bin/gitaly-git-remote-http-prev
        - _build/bin/gitaly-git-remote-http-mvcc
      env:
      - CGO_ENABLED=0
      ldflags:
      - -X github.com/feder-cr/open_scion/internal/version.version=dev-local
    hooks:
      before:
      - command:
        - sh
        - -c
        - bash ./.gitlab/caproni/build-gitaly-helpers.sh
      after:
      - command:
        - sh
        - -c
        - bash ./.gitlab/caproni/import-gitaly-images.sh
  local:
    push: false
    useBuildkit: true

manifests:
  rawYaml:
  - k8s/*.yaml

deploy:
  kubectl:
    defaultNamespace: gitlab
    # Without this, helm won't upgrade gitaly after skaffold has deployed it.
    # `caproni up` resets gitaly to the chart's image, so run `caproni run` to
    # start edit mode again.
    flags:
      apply:
        - --server-side
        - --force-conflicts
        - --field-manager=helm

portForward:
- resourceType: service
  resourceName: gitlab-gitaly
  port: 8075
  localPort: 8075
- resourceType: service
  resourceName: gitlab-gitaly
  port: 9236
  localPort: 9236
